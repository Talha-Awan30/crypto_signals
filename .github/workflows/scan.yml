name: v5-build-check

# The v5 bot is designed to run 24/7 on Oracle Cloud (state machine needs to
# persist across candles). GitHub Actions can no longer execute the scanner
# meaningfully — it's left here only to verify the build on every push.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Smoke import
        run: python -c "from bot import main; print('v5 imports OK')"
      - name: Docker build
        run: docker build -t crypto-v5:ci .
